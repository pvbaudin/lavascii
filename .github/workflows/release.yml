name: Release

# Push a tag like v0.1.0 to build binaries for every platform and publish
# them, with checksums and .deb packages, as a GitHub Release.
on:
  push:
    tags: ["v*"]

permissions:
  contents: write

jobs:
  build:
    name: ${{ matrix.target }}
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - { target: aarch64-apple-darwin,      os: macos-latest }
          - { target: x86_64-apple-darwin,       os: macos-latest }
          - { target: x86_64-unknown-linux-gnu,  os: ubuntu-latest,    deb: true }
          - { target: aarch64-unknown-linux-gnu, os: ubuntu-24.04-arm, deb: true }
    steps:
      - uses: actions/checkout@v4

      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: ${{ matrix.target }}

      - name: Build
        run: cargo build --release --locked --target ${{ matrix.target }}

      - name: Package tarball
        shell: bash
        run: |
          name="lavascii-${GITHUB_REF_NAME}-${{ matrix.target }}"
          mkdir -p "dist/$name"
          cp "target/${{ matrix.target }}/release/lavascii" README.md LICENSE "dist/$name/"
          tar -C dist -czf "dist/$name.tar.gz" "$name"
          (cd dist && shasum -a 256 "$name.tar.gz" > "$name.tar.gz.sha256")

      - name: Package .deb
        if: matrix.deb
        run: |
          cargo install cargo-deb --locked
          cargo deb --no-build --target ${{ matrix.target }} --output dist/
          (cd dist && for f in *.deb; do shasum -a 256 "$f" > "$f.sha256"; done)

      - uses: actions/upload-artifact@v4
        with:
          name: ${{ matrix.target }}
          path: |
            dist/*.tar.gz
            dist/*.deb
            dist/*.sha256

  release:
    needs: build
    runs-on: ubuntu-latest
    steps:
      - uses: actions/download-artifact@v4
        with:
          path: dist
          merge-multiple: true

      - uses: softprops/action-gh-release@v2
        with:
          files: dist/*
          generate_release_notes: true
