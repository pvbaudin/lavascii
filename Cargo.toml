[package]
name = "lavascii"
version = "0.1.0"
edition = "2021"
description = "A full-color ASCII lava lamp for your terminal"
authors = ["Pierre Baudin <34721711+pvbaudin@users.noreply.github.com>"]
license = "MIT"
repository = "https://github.com/pvbaudin/lavascii"
homepage = "https://github.com/pvbaudin/lavascii"
readme = "README.md"
keywords = ["terminal", "ascii-art", "lava-lamp", "screensaver", "tui"]
categories = ["command-line-utilities"]

[dependencies]
crossterm = "0.28"
pdf-extract = "0.7"

[target.'cfg(unix)'.dependencies]
libc = "0.2"

[profile.release]
opt-level = 3
lto = true
